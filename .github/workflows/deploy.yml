name: Deploy Website via FTP

on:
    push:
        branches:
            - main # Jalankan otomatis saat push ke branch main

jobs:
    web-deploy:
        name: 🚀 Deploy via FTP
        runs-on: ubuntu-latest
        steps:
            - name: 🚚 Get latest code
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: 📦 Install Dependencies
              run: npm ci

            - name: 🏗️ Build Next.js standalone
              run: npm run build

            - name: 📦 Prepare persistent-data standalone package
              run: |
                  mkdir -p .next/standalone/.next/static .next/standalone/public .next/standalone/data-seed
                  cp -R .next/static/. .next/standalone/.next/static/
                  cp -R public/. .next/standalone/public/
                  cp data/*.json .next/standalone/data-seed/

            - name: 📂 Upload Node.js application to cPanel
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  port: 21
                  local-dir: ./.next/standalone/
                  exclude: |
                      **/data/*.json
