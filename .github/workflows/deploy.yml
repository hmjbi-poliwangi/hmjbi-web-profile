name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js standalone
        run: npm run build

      - name: 📦 Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next/static .next/standalone/public/_next/static
          cp -R .next/static/. .next/standalone/.next/static/
          cp -R .next/static/. .next/standalone/public/_next/static/
          cp -R public/. .next/standalone/public/
          test -s .next/standalone/server.js
          test -n "$(find .next/standalone/.next/static -type f -print -quit)"
          echo "Prepared Next.js static assets"

      - name: 📁 Ensure directory structure
        run: |
          find .next/standalone -type d -exec touch {}/.gitkeep \;

      - name: 📂 Upload Node.js application to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./.next/standalone/
          log-level: verbose
          state-name: .ftp-deploy-standalone-state.json
          exclude: |
            **/node_modules/**
            node_modules/**
